<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Meals" />
  <title>Family Meal Planner</title>
  <style>
    html, body { margin: 0; height: 100%; background: #E9EDE3; }
    #root { height: 100%; }
    .boot { display: grid; place-items: center; height: 100%; font: 700 16px system-ui, sans-serif; color: #5A6B62; }
  </style>

  <!-- Saves your meals in this browser (the app was built to use a simple key/value store). -->
  <script>
    (function () {
      var P = "mp:";
      window.storage = {
        get: async function (key) {
          var v = localStorage.getItem(P + key);
          if (v === null) throw new Error("not found");
          return { key: key, value: v, shared: false };
        },
        set: async function (key, value) {
          localStorage.setItem(P + key, value);
          return { key: key, value: value, shared: false };
        },
        delete: async function (key) {
          localStorage.removeItem(P + key);
          return { key: key, deleted: true, shared: false };
        },
        list: async function (prefix) {
          prefix = prefix || "";
          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(P + prefix) === 0) keys.push(k.slice(P.length));
          }
          return { keys: keys, prefix: prefix, shared: false };
        }
      };
    })();
  </script>

  <!-- RECIPE-LOADER-START -->
  <!-- Loads recipes.json (the meal library). If it can't be reached, the last copy is used. -->
  <script>
    (function () {
      var CACHE_KEY = "mealplan-recipes-cache";
      window.__recipesReady = (async function () {
        var status = { source: "none", error: "" };
        var list = [];
        try {
          var res = await fetch("recipes.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("recipes.json " + res.status);
          var data = await res.json();
          var arr = Array.isArray(data) ? data : data && data.recipes;
          if (!Array.isArray(arr)) throw new Error("recipes.json isn't a list of recipes");
          list = arr;
          status = { source: "network", error: "" };
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(arr)); } catch (e) { /* storage full or blocked */ }
        } catch (e) {
          var why = String((e && e.message) || e);
          try {
            var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
            if (Array.isArray(cached)) { list = cached; status = { source: "cache", error: why }; }
            else status = { source: "none", error: why };
          } catch (e2) {
            status = { source: "none", error: why };
          }
        }
        window.__RECIPES__ = list;
        window.__RECIPES_STATUS__ = status;
      })();
    })();
  </script>
  <!-- RECIPE-LOADER-END -->

  <!-- Loads React and the icons from a public CDN. No build step needed. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root"><div class="boot">Loading your meals…</div></div>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script type="module">
    await window.__recipesReady;
    const [{ createElement }, { createRoot }, { default: App }] = await Promise.all([
      import("react"),
      import("react-dom/client"),
      import("./app.js"),
    ]);
    createRoot(document.getElementById("root")).render(createElement(App));
  </script>
</body>
</html>
